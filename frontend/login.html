<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShellDeck — Login</title>
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/static/logo-icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("shelldeck_theme");
        if (t === "light" || t === "dark" || t === "premium") document.documentElement.setAttribute("data-theme", t);
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-brand"><img src="/static/logo-dark.svg" alt="ShellDeck" id="brand-logo" style="width:170px;height:26px;display:block;margin:0 auto" /></div>
    <div class="auth-tabs">
      <button id="tab-login" class="auth-tab active" type="button">Login</button>
      <button id="tab-register" class="auth-tab" type="button">Register</button>
    </div>
    <form id="auth-form" autocomplete="on">
      <label>Username
        <input id="a-username" name="username" autocomplete="username" required />
      </label>
      <label>Password
        <input id="a-password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <label id="totp-field" style="display:none">2FA Code
        <input id="a-totp" name="totp" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" />
      </label>
      <div id="auth-error" class="auth-error"></div>
      <button type="submit" id="auth-submit" class="btn btn-primary btn-block">Login</button>
      <button type="button" id="oidc-login" class="btn btn-ghost btn-block hidden" style="margin-top:8px">Sign in with SSO</button>
    </form>
    <p class="auth-hint" id="auth-hint">Don't have an account? Switch to Register.</p>
  </div>
  <script>
    // Pick the wordmark logo variant that matches the saved theme on load.
    (function () {
      try {
        var t = localStorage.getItem("shelldeck_theme") || "dark";
        var el = document.getElementById("brand-logo");
        if (el) el.src = (t === "light") ? "/static/logo-light.svg" : "/static/logo-dark.svg";
      } catch (_) {}
    })();
  </script>
  <script src="/static/login.js?v=3"></script>
</body>
</html>
