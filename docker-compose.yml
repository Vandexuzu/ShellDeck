services:
  shelldeck:
    build: .
    container_name: shelldeck
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    # Persist the SQLite DB + .env inside the volume
    command: sh -c "cp -n .env /app/data/.env 2>/dev/null; uvicorn app.main:app --host 0.0.0.0 --port 8000"
